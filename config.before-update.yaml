# =====================================================================
# nightops configuration
# Rule: everything plain code can do is done without AI.
# AI is OFF by default.
# =====================================================================

storage:
  db_path: nightops.db

# ---------------------------------------------------------------------
# GitHub
# ---------------------------------------------------------------------
github:
  token_env: GITHUB_TOKEN
  # The ONLY repositories nightops may write to (issues, PRs, branches),
  # and only after you approve. Everything else is read-only.
  own_repos:                     # add your repos directly below this line
    # - YOUR_GITHUB_USER/your-repo

# ---------------------------------------------------------------------
# Web console (terminal-style, with live alarms)
# ---------------------------------------------------------------------
web:
  host: 127.0.0.1            # keep it local; reach it via SSH tunnel or nginx HTTPS
  port: 8800
  cookie_secure: true        # keep true (works over HTTPS and http://localhost)
  trust_proxy: false         # set true ONLY when behind the provided nginx config
  allowed_origins: []        # e.g. ["https://ops.yourdomain.com"] when using nginx
  session_idle_minutes: 30
  session_max_hours: 12
  max_login_failures: 5
  lockout_minutes: 15
  poll_seconds: 10

# ---------------------------------------------------------------------
# Jobs & internships (official public APIs only, no scraping)
# ---------------------------------------------------------------------
jobs:
  enabled: true
  looking_for: both          # internship | job | both
  profile: >-
    Python backend developer (FastAPI, Flask), document generation, XML,
    deployments on Linux with nginx and systemd. Looking for internships
    and entry-level roles.
  role_keywords: [python, backend, back-end, fastapi, django, flask, "software engineer",
                  "software developer", developer, sde, "full stack", fullstack, api]
  internship_keywords: [intern, internship, trainee, apprentice, apprenticeship]
  entry_keywords: [junior, entry, "entry-level", graduate, fresher, "new grad", "0-2 years", associate]
  exclude_keywords: [senior, "sr.", sr, lead, principal, staff, manager, director, head,
                     architect, "5+ years", "7+ years", "8+ years", "10+ years"]
  # A posting must mention one of these locations, or be remote with no restriction.
  require_location_match: true
  locations: [india, remote, anywhere, worldwide, global, asia, apac, delhi, "new delhi",
              noida, gurgaon, gurugram, ghaziabad, bangalore, bengaluru, hyderabad, pune,
              mumbai, chennai]
  preferred_locations: [india, delhi, noida, gurgaon, gurugram, ghaziabad]
  skill_keywords: [python, fastapi, flask, django, sql, postgresql, rest, api, linux,
                   docker, nginx, xml, pdf, git, javascript, react]
  max_age_days: 21
  alarm_score: 35            # new postings at/above this score raise an alarm
  scoring:
    skill: 8
    entry_level: 10
    internship: 5
    remote: 5
    preferred_location: 8
    fresh_3d: 10
    fresh_7d: 5
  ai_fit:                    # only used if ai.enabled
    enabled: true
    top_n: 5
  sources:
    remotive:   {enabled: true, searches: [python, backend], min_interval_hours: 6}
    arbeitnow:  {enabled: true, pages: 2, min_interval_hours: 6}
    remoteok:   {enabled: true, min_interval_hours: 6}
    hn:         {enabled: true, max_posts: 600, min_interval_hours: 12}
    # Company career pages. Find the name in the careers URL:
    #   boards.greenhouse.io/<name>  or  job-boards.greenhouse.io/<name>
    #   jobs.lever.co/<name>
    greenhouse: {enabled: true, boards: [], min_interval_hours: 6}
    lever:      {enabled: true, companies: [], min_interval_hours: 6}

# ---------------------------------------------------------------------
# scout - open-source issues and projects for you (read-only)
# ---------------------------------------------------------------------
scout:
  enabled: true
  ai_triage: true              # only used if ai.enabled
  ai_triage_top_n: 5
  search_pages: 1              # 50 results per search; GitHub dislikes deep paging
  max_vet_per_run: 40          # issues checked in detail per run (keeps under GitHub's limits)
  revet_hours: 24              # don't re-check the same issue more often than this
  updated_within_days: 120
  alarm_score: 50              # new issues at/above this score raise an alarm
  searches:
    - {language: python, issue_labels: ["good first issue"]}
    - {language: python, issue_labels: ["help wanted"]}
    - {language: python, issue_labels: ["good first issue", "help wanted"], keywords: [fastapi]}
    - {language: python, issue_labels: ["good first issue", "help wanted"], keywords: [pdf]}
  skill_keywords: [python, fastapi, flask, pdf, pymupdf, docx, document, xml, lxml,
                   api, openapi, template, parser, cli]
  disqualify:
    assigned: true
    open_linked_pr: true
  title_blocklist: [benchmark, evaluate, evaluation, research, gsoc, "proof of concept",
                    feasibility, investigate, spike, epic, rewrite, "16-week"]
  claim_phrases: ["i'd like to work", "i would like to work", "i want to work on",
                  "can i work on", "can i take", "may i take", "may i work", "i'll take",
                  "i will take", "i'd like to take", "i would like to take",
                  "i'd love to take", "i would love to take", "working on this",
                  "i'm working on", "i am working on", "assign me", "assign this to me",
                  "please assign", "can i be assigned", "picking this up", "i'll pick this",
                  "let me take this", "dibs"]
  health:
    max_repo_idle_days: 90
    check_external_prs: true
    external_pr_sample: 30
  scoring:
    skill_keyword: 10
    updated_14d: 15
    updated_30d: 8
    help_wanted_bonus: 5
    has_contributing_bonus: 5
    external_prs_bonus: 15
    claim_penalty: -40
    short_body_penalty: -5
    ai_easy_bonus: 10
    ai_hard_penalty: -30
    ai_upstream_penalty: -30
  projects:                    # healthy projects to contribute to (not just single issues)
    enabled: true
    languages: [python]
    min_good_first_issues: 3
    min_stars: 50
    max_stars: 5000            # very big projects get swarmed by beginners
    pushed_within_days: 30
    info_score: 30

# ---------------------------------------------------------------------
# worker - maintain YOUR repos (every change needs your approval)
# ---------------------------------------------------------------------
worker:
  enabled: true
  workdir: work
  propose_issues: true       # missing LICENSE/README, failing tests, outdated deps
  license:
    fix_with_pr: true        # missing LICENSE -> propose a PR that adds one (no AI)
    type: mit                # any key from https://api.github.com/licenses (mit, apache-2.0, gpl-3.0...)
    holder: ""               # name in the license; empty = your GitHub profile name
  repos:                        # add your repos directly below this line
    # - repo: YOUR_GITHUB_USER/your-repo
    #   default_branch: main
    #   setup_command: "python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt"
    #   test_command: ".venv/bin/python -m pytest -q"
    #   lint_command: ""
    #   issue_label: nightops    # AI only touches issues YOU give this label
  ai_fix:
    mode: "off"                # "off" | builtin | command  (keep the quotes on "off")
    max_issues_per_night: 2
    max_files: 6
    max_context_chars: 40000
    max_output_tokens: 4000
    agent_command: "claude -p --permission-mode acceptEdits"
    agent_timeout: 1800

# ---------------------------------------------------------------------
# automations - your own scripts (files in automations/), run on a schedule
# ---------------------------------------------------------------------
# Create one:  python nightops.py automations new my_watcher
# Only automations listed under "run" ever run; a file alone does nothing.
# Schedules: every 30m | every 2h | hourly | daily 08:30 | manual
automations:
  enabled: true
  timezone: Asia/Kolkata           # for "daily HH:MM"
  timeout_seconds: 300             # each run is stopped after this
  run:                             # add your automations directly below this line
    # page_watch:
    #   schedule: every 2h
    #   settings:
    #     pages:
    #       - {name: Example careers, url: "https://example.com/careers", keyword: intern}
    # github_releases:
    #   schedule: daily 09:00
    #   settings:
    #     repos: [fastapi/fastapi, pydantic/pydantic]
    # job_digest:
    #   schedule: daily 08:00
    #   settings:
    #     top: 5

# ---------------------------------------------------------------------
# brief - morning report (no AI)
# ---------------------------------------------------------------------
briefing:
  enabled: true
  output_dir: briefings

# ---------------------------------------------------------------------
# AI gateway (optional): Gemini, with pause & resume on limits
# ---------------------------------------------------------------------
ai:
  enabled: false
  max_input_chars: 12000
  cache: true                       # same question never costs twice, across all providers
  queue_drain_per_run: 20           # paused AI tasks a module may finish right away
  queue_drain_per_timer: 60         # paused AI tasks the 10-minute "ai" timer may finish

  # Each provider: its key (in .env), your own daily cap, and limits a little
  # BELOW the real ones, so nightops pauses itself before the provider refuses.
  # Real limits change often - check each provider's dashboard.
  providers:
    gemini:
      type: gemini
      api_key_env: GEMINI_API_KEY
      daily_tokens: 400000          # your own cap per day
      min_interval_seconds: 6       # gap between calls
      limits: {rpm: 8, rpd: 150}    # Google AI Studio -> "Rate limit" shows yours
      # daily_reset: America/Los_Angeles   (Gemini's daily quota resets at midnight Pacific; this is the default)
    groq:                           # runs open-source models (Llama, gpt-oss) very fast
      type: openai_compatible
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      daily_tokens: 300000
      min_interval_seconds: 2
      limits: {rpm: 25}             # console.groq.com -> Settings -> Limits shows yours
    openrouter:                     # many free open-source models through one key
      type: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      min_interval_seconds: 4
      limits: {rpm: 15, rpd: 45}
    ollama:                         # fully local open-source models (needs RAM/CPU on the server)
      type: openai_compatible
      base_url: http://localhost:11434/v1
      enabled: false

  # Which AI does which task. Tried in order: if the first is paused or out of
  # quota, the next takes over. If ALL are out, the task waits in the queue and
  # resumes from the same point when a limit resets.
  routes:
    jobs_fit:                       # "how well does this job fit you" notes
      - {provider: groq, model: llama-3.1-8b-instant}
      - {provider: gemini, model: gemini-3.1-flash-lite}
      - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    scout_triage:                   # judging open-source issue difficulty
      - {provider: gemini, model: gemini-3.1-flash-lite}
      - {provider: groq, model: llama-3.1-8b-instant}
    worker_fix:                     # code fixes on your repos (only if worker.ai_fix.mode: builtin)
      - {provider: groq, model: llama-3.3-70b-versatile}
      - {provider: gemini, model: gemini-3.1-flash-lite}
    default:
      - {provider: groq, model: llama-3.1-8b-instant}
      - {provider: gemini, model: gemini-3.1-flash-lite}

# ---------------------------------------------------------------------
# Push alarms to your phone too (optional). The web console works without this.
# ---------------------------------------------------------------------
notify:
  channels: []                 # add: telegram, email
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 587
    user_env: SMTP_USER
    password_env: SMTP_PASSWORD
    to: you@example.com

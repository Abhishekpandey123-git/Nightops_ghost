# OPTIONAL: expose the console over HTTPS on your own subdomain.
# The SSH tunnel (see SETUP.md) is simpler and even safer; use this only if
# you want to open the console from a browser without SSH.
#
# 1. Point a DNS A record (e.g. ops.yourdomain.com) at the server.
# 2. Copy to /etc/nginx/sites-available/nightops, edit server_name,
#    ln -s it into sites-enabled, then: sudo certbot --nginx -d ops.yourdomain.com
# 3. In config.yaml: web.trust_proxy: true, web.allowed_origins: ["https://ops.yourdomain.com"]

# Rate limit: 10 requests/second per IP, stricter for the login page.
limit_req_zone $binary_remote_addr zone=nightops:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=nightops_login:10m rate=10r/m;

server {
    listen 80;
    server_name ops.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ops.yourdomain.com;
    # certbot fills in ssl_certificate / ssl_certificate_key here

    # Optional but strongly recommended: only your own IP(s) may connect.
    # allow 203.0.113.10;
    # deny all;

    server_tokens off;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /login {
        limit_req zone=nightops_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_req zone=nightops burst=30 nodelay;
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
